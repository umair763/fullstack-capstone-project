<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .landing-content {
            max-width: 700px;
            padding: 40px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .tagline {
            font-size: 1.3rem;
            margin-bottom: 35px;
            line-height: 1.7;
            opacity: 0.95;
        }
        .btn-get-started {
            display: inline-block;
            padding: 16px 48px;
            font-size: 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-get-started:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="landing-content">
        <h1>GiftLink</h1>
        <p class="tagline">
            Connect with your community to share household items you no longer need.
            Give freely, find treasures, and reduce waste — all in one place.
        </p>
        <a href="/app" class="btn-get-started">Get Started</a>
    </div>
</body>
</html>
